<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽球發球技能測驗與動作軌跡分析系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; font-size: 12pt; }
    }
    .court-zone {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .court-zone:hover {
      filter: brightness(1.15);
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-16">

  <!-- 頂端導覽列 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-feather-pointed text-2xl text-emerald-300"></i>
        <h1 class="text-xl font-bold tracking-wide">羽球「發球」技能測驗與軌跡評分系統</h1>
      </div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm transition">
          <i class="fa-solid fa-print mr-1"></i> 列印 / PDF
        </button>
        <button onclick="exportCSV()" class="bg-emerald-800 hover:bg-emerald-900 text-white px-3 py-1.5 rounded-lg text-sm transition">
          <i class="fa-solid fa-file-csv mr-1"></i> 匯出CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- 基本資料區塊 -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 border-b pb-2 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-id-card text-emerald-600"></i> 學生與評分者基本資料
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">班級</label>
          <input type="text" id="studentClass" placeholder="例如：高一1班" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">座號</label>
          <input type="number" id="seatNumber" placeholder="例如：05" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">學生姓名</label>
          <input type="text" id="studentName" placeholder="姓名" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">評分者 / 計分者</label>
          <input type="text" id="evaluatorName" placeholder="例如：王老師 / 同儕姓名" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
      </div>
    </div>

    <!-- 錄影與發球路徑分析模組 -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 no-print">
      <h2 class="text-lg font-bold text-slate-800 border-b pb-2 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-video text-rose-600"></i> 發球影片錄影與軌跡檢核 (影片分析)
      </h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 錄影控制區 -->
        <div class="space-y-3">
          <div class="relative bg-black rounded-lg overflow-hidden aspect-video flex items-center justify-center">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="recordingBadge" class="hidden absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-full animate-pulse flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-white"></span> 錄影中 (<span id="recordTimer">0s</span>)
            </div>
          </div>
          <div class="flex flex-wrap gap-2 justify-between">
            <div class="flex gap-2">
              <button id="startCamBtn" onclick="startCamera()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg">開啟鏡頭</button>
              <button id="recordBtn" onclick="toggleRecording()" disabled class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-lg opacity-50 cursor-not-allowed">開始錄影</button>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-400">或上傳影片:</span>
              <input type="file" id="videoUpload" accept="video/*" class="text-xs text-slate-500 border rounded p-1">
            </div>
          </div>
        </div>

        <!-- 影片慢動作與軌跡繪製區 -->
        <div class="space-y-3">
          <div class="relative bg-black rounded-lg overflow-hidden aspect-video">
            <video id="playbackVideo" class="w-full h-full object-contain" controls></video>
            <canvas id="trajectoryCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-auto cursor-crosshair"></canvas>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1">
              <span class="text-xs font-bold text-slate-600">播放速度:</span>
              <button onclick="setSpeed(0.25)" class="px-2 py-1 bg-slate-200 hover:bg-emerald-500 hover:text-white rounded text-xs font-semibold">0.25x</button>
              <button onclick="setSpeed(0.5)" class="px-2 py-1 bg-slate-200 hover:bg-emerald-500 hover:text-white rounded text-xs font-semibold">0.5x</button>
              <button onclick="setSpeed(1.0)" class="px-2 py-1 bg-slate-200 hover:bg-emerald-500 hover:text-white rounded text-xs font-semibold">1.0x</button>
            </div>
            <div class="flex gap-2">
              <button onclick="clearCanvas()" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded text-xs font-semibold">
                <i class="fa-solid fa-eraser mr-1"></i>清除軌跡
              </button>
            </div>
          </div>
          <p class="text-xs text-slate-500"><i class="fa-solid fa-info-circle text-blue-500"></i> 您可以播放影片並在畫面上用滑鼠或手指直接劃出羽球弧線與擊球位置，以檢核過腰及發球軌跡。</p>
        </div>
      </div>
    </div>

    <!-- 評分主體：動作評分 40% 與 落點評分 60% -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- 左側：動作要領與評分標準 (40%) -->
      <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-user-check text-blue-600"></i> 動作評分項 (教師評分 40%)
          </h2>
          <span class="text-sm font-semibold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-full" id="actionTotalDisplay">動作得分：0 / 40 分</span>
        </div>

        <!-- 正手發長球 -->
        <div>
          <h3 class="font-bold text-emerald-800 text-sm mb-2 flex items-center gap-1">
            <i class="fa-solid fa-circle-right"></i> 正手發長球 (右撇子)
          </h3>
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 border-b">
                  <th class="p-2">項目與權重</th>
                  <th class="p-2 text-center">完美</th>
                  <th class="p-2 text-center">能做到</th>
                  <th class="p-2 text-center">仍須努力</th>
                  <th class="p-2 text-center">無法掌握</th>
                </tr>
              </thead>
              <tbody class="divide-y" id="forehandTable">
                <!-- JS 動態生成項目 -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- 反手發短球 -->
        <div>
          <h3 class="font-bold text-emerald-800 text-sm mb-2 flex items-center gap-1">
            <i class="fa-solid fa-circle-right"></i> 反手發短球 (右撇子)
          </h3>
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 border-b">
                  <th class="p-2">項目與權重</th>
                  <th class="p-2 text-center">完美</th>
                  <th class="p-2 text-center">能做到</th>
                  <th class="p-2 text-center">仍須努力</th>
                  <th class="p-2 text-center">無法掌握</th>
                </tr>
              </thead>
              <tbody class="divide-y" id="backhandTable">
                <!-- JS 動態生成項目 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 右側：發球落點示意圖與得分 (60%) -->
      <div class="space-y-6">
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-bullseye text-red-600"></i> 落點得分 (同儕評分 60%)
            </h2>
            <span class="text-sm font-semibold text-red-700 bg-red-50 px-2.5 py-1 rounded-full" id="landingTotalDisplay">落點得分：0 / 60 分</span>
          </div>

          <!-- 步驟 1：選擇目前要給分的球數 -->
          <div class="mb-4">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">1. 請選擇當前要記錄的發球：</label>
            <div class="grid grid-cols-3 gap-1.5 text-xs">
              <button onclick="selectServeSlot('fh1')" id="btn_fh1" class="serve-slot-btn py-1.5 px-2 border rounded-lg font-bold bg-emerald-600 text-white shadow">正手 1</button>
              <button onclick="selectServeSlot('fh2')" id="btn_fh2" class="serve-slot-btn py-1.5 px-2 border rounded-lg font-bold bg-slate-100 text-slate-700">正手 2</button>
              <button onclick="selectServeSlot('fh3')" id="btn_fh3" class="serve-slot-btn py-1.5 px-2 border rounded-lg font-bold bg-slate-100 text-slate-700">正手 3</button>
              <button onclick="selectServeSlot('bh1')" id="btn_bh1" class="serve-slot-btn py-1.5 px-2 border rounded-lg font-bold bg-slate-100 text-slate-700">反手 1</button>
              <button onclick="selectServeSlot('bh2')" id="btn_bh2" class="serve-slot-btn py-1.5 px-2 border rounded-lg font-bold bg-slate-100 text-slate-700">反手 2</button>
              <button onclick="selectServeSlot('bh3')" id="btn_bh3" class="serve-slot-btn py-1.5 px-2 border rounded-lg font-bold bg-slate-100 text-slate-700">反手 3</button>
            </div>
          </div>

          <!-- 步驟 2：球場得分區域示意圖 (互動區) -->
          <div class="mb-4 border rounded-xl p-3 bg-emerald-900 text-white shadow-inner">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-emerald-200">2. 點擊球場落點區域直接帶入分數：</span>
              <span id="activeSlotBadge" class="text-xs bg-amber-400 text-slate-900 font-extrabold px-2 py-0.5 rounded">正在給分：正手長球 1</span>
            </div>
            
            <!-- 羽球半場示意圖 -->
            <div class="relative w-full aspect-[4/3] bg-emerald-700 border-2 border-white rounded-lg flex flex-col justify-between overflow-hidden
